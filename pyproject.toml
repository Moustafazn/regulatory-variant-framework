[project]
name = "neurojico-rough-set"
version = "1.0.0"
description = "Human-AI augmented regulatory variant interpretation using AlphaGenome + Decima + rough-soft uncertainty"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "joblib>=1.4,<2",
  # Foundational models
  "alphagenome>=0.2",
  "huggingface_hub>=0.26",
  "torch>=2.4,<3",
  # Decima (installed from PyPI as decima; HF weights downloaded at runtime)
  "decima>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
neurojico = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regulatory_model*"]

[tool.setuptools.package-data]
regulatory_model = ["config.json"]
