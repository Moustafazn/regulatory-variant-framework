[project]
name = "regulatory-variant-framework"
version = "2.0.0"
description = "Reproducible immune-cell regulatory variant transfer and review-prioritization benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2",
  "openpyxl>=3.1,<4", "joblib>=1.4,<2", "pyliftover>=0.4,<1", "pyfaidx>=0.8,<1",
  "pyBigWig>=0.3.22,<1", "matplotlib>=3.9,<4", "certifi>=2024.2.2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
regulatory-variants = "main:main"
# Compatibility command for existing workflows.
neurojico = "main:main"

[project.urls]
Repository = "https://github.com/Moustafazn/regulatory-variant-framework"
Issues = "https://github.com/Moustafazn/regulatory-variant-framework/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regulatory_model*"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
regulatory_model = ["config.json"]
